<!-- admin/productos.html -->
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Productos | Admin</title>
    <link rel="stylesheet" href="css/admin.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <aside class="sidebar">
        <div class="sidebar-logo"><i class="fa-solid fa-mug-hot"></i> Enamorate</div>
        <nav class="sidebar-nav">
            <a href="dashboard.html"><i class="fa-solid fa-chart-pie"></i> Dashboard</a>
            <a href="pedidos.html"><i class="fa-solid fa-receipt"></i> Pedidos</a>
            <a href="productos.html" class="active"><i class="fa-solid fa-box"></i> Productos</a>
            <!-- NUEVA ETIQUETA -->
            <a href="reclamos.html"><i class="fa-solid fa-triangle-exclamation"></i> Reclamos</a>
            <a href="reportes.html"><i class="fa-solid fa-file-excel"></i> Reportes</a>
        </nav>
        <div style="margin-top: auto; padding: 20px;">
            <button onclick="logout()" class="btn-logout" style="width: 100%;"><i class="fa-solid fa-power-off"></i> Salir</button>
        </div>
    </aside>

    <main class="main-content">
        <div class="top-header">
            <h1>Gestión de Productos</h1>
            <button class="btn-primary" onclick="abrirModal()"><i class="fa-solid fa-plus"></i> Nuevo Producto</button>
        </div>

        <!-- BARRA DE FILTROS Y BÚSQUEDA -->
        <div class="controls-bar">
            <div class="filtros-categorias" id="filtros">
                <button class="filtro-btn active" onclick="filtrarPorCategoria('todos', this)">Todos</button>
                <button class="filtro-btn" onclick="filtrarPorCategoria('1', this)">Piqueos</button>
                <button class="filtro-btn" onclick="filtrarPorCategoria('2', this)">Platos</button>
                <button class="filtro-btn" onclick="filtrarPorCategoria('3', this)">Cócteles</button>
                <button class="filtro-btn" onclick="filtrarPorCategoria('4', this)">Cafés</button>
                <button class="filtro-btn" onclick="filtrarPorCategoria('5', this)">Refrescos</button>
                <button class="filtro-btn" onclick="filtrarPorCategoria('6', this)">Postres</button>
            </div>

            <!-- BUSCADOR MINIMALISTA -->
            <div class="search-container" id="search-container">
                <i class="fa-solid fa-search" onclick="toggleSearch()"></i>
                <input type="text" id="input-busqueda" placeholder="Buscar producto..." oninput="buscarProducto()">
            </div>
        </div>

        <div class="table-container">
            <table>
                <thead><tr><th>Imagen</th><th>Nombre</th><th>Precio</th><th>Costo</th><th>Stock</th><th>Acciones</th></tr></thead>
                <tbody id="tabla-productos"></tbody>
            </table>
        </div>
    </main>

    <!-- MODAL FLOTANTE DE PRODUCTO -->
    <div class="modal" id="modal-producto">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modal-title">Nuevo Producto</h2>
                <button type="button" class="close-modal" onclick="cerrarModal()"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <form id="form-producto">
                <input type="hidden" id="prod-id">
                <div class="form-row">
                    <div class="form-group"><label>Nombre</label><input type="text" id="prod-nombre" required></div>
                    <div class="form-group"><label>Categoría</label>
                        <select id="prod-categoria">
                            <option value="1">Piqueos</option>
                            <option value="2">Platos</option>
                            <option value="3">Cócteles</option>
                            <option value="4">Cafés</option>
                            <option value="5">Refrescos</option>
                            <option value="6">Postres</option>
                        </select>
                    </div>
                </div>
                <div class="form-group"><label>Descripción</label><textarea id="prod-desc" rows="3" required></textarea></div>
                <div class="form-row">
                    <div class="form-group"><label>Precio (S/)</label><input type="number" step="0.1" id="prod-precio" required></div>
                    <div class="form-group"><label>Costo (S/)</label><input type="number" step="0.1" id="prod-costo" required></div>
                    <div class="form-group"><label>Stock</label><input type="number" id="prod-stock" required></div>
                </div>
                <div class="form-group"><label>Imagen (Dejar en blanco para mantener la actual)</label><input type="file" id="prod-imagen" accept="image/*"></div>
                <div style="display: flex; gap: 10px; margin-top: 20px;">
                    <button type="button" class="btn-secondary" onclick="cerrarModal()" style="flex: 1;">Cancelar</button>
                    <button type="submit" class="btn-primary" style="flex: 2;" id="btn-guardar">Guardar Producto</button>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>
    <script src="js/auth.js"></script>
    <script>
        checkSession();
        let todosLosProductos = [];
        let categoriaActual = 'todos';

        async function cargarProductos() {
            const { data } = await supabaseClient.from('productos').select('*').order('id', { ascending: false });
            todosLosProductos = data || [];
            renderizarTabla(todosLosProductos);
        }

        function renderizarTabla(lista) {
            const tbody = document.getElementById('tabla-productos');
            tbody.innerHTML = '';
            if(lista.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; padding: 30px; color: var(--text-muted);"><i class="fa-solid fa-box-open" style="font-size: 2rem; margin-bottom: 10px; display: block;"></i> No hay productos en esta categoría</td></tr>';
                return;
            }
            lista.forEach(p => {
                tbody.innerHTML += `
                    <tr>
                        <td><img src="${p.imagen_url || 'https://via.placeholder.com/50'}" style="width: 50px; height: 50px; object-fit: cover; border-radius: 8px;"></td>
                        <td>${p.nombre}</td>
                        <td>S/ ${Number(p.precio).toFixed(2)}</td>
                        <td>S/ ${Number(p.costo).toFixed(2)}</td>
                        <td>${p.stock}</td>
                        <td>
                            <button class="btn-secondary" onclick="abrirModalEditar(${p.id})" style="padding: 5px 10px; margin-right: 5px;" title="Editar"><i class="fa-solid fa-pen"></i></button>
                            <button class="btn-danger" onclick="eliminarProducto(${p.id})" title="Eliminar"><i class="fa-solid fa-trash"></i></button>
                        </td>
                    </tr>
                `;
            });
        }

        // FILTROS
        function filtrarPorCategoria(idCat, boton) {
            document.querySelectorAll('.filtro-btn').forEach(btn => btn.classList.remove('active'));
            boton.classList.add('active');
            categoriaActual = idCat;
            aplicarFiltros();
        }

        function buscarProducto() {
            aplicarFiltros();
        }

        function aplicarFiltros() {
            try {
                const textoBusqueda = document.getElementById('input-busqueda').value.toLowerCase();
                let filtrados = todosLosProductos;

                if (categoriaActual !== 'todos') {
                    filtrados = filtrados.filter(p => String(p.categoria_id) === String(categoriaActual));
                }

                if (textoBusqueda) {
                    filtrados = filtrados.filter(p => p.nombre.toLowerCase().includes(textoBusqueda));
                }

                renderizarTabla(filtrados);
            } catch (error) {
                console.error("Error al filtrar:", error);
            }
        }

        // BUSCADOR EXPANDIBLE
        function toggleSearch() {
            const container = document.getElementById('search-container');
            const input = document.getElementById('input-busqueda');
            container.classList.toggle('active');
            if (container.classList.contains('active')) {
                input.focus();
            } else {
                input.value = '';
                aplicarFiltros();
            }
        }

        // MODAL
        function abrirModal() {
            document.getElementById('form-producto').reset();
            document.getElementById('prod-id').value = '';
            document.getElementById('modal-title').innerText = 'Nuevo Producto';
            document.getElementById('prod-categoria').value = '1';
            document.getElementById('prod-stock').value = '10';
            document.getElementById('modal-producto').classList.add('open');
        }

        function abrirModalEditar(id) {
            const p = todosLosProductos.find(prod => prod.id === id);
            document.getElementById('prod-id').value = p.id;
            document.getElementById('prod-nombre').value = p.nombre;
            document.getElementById('prod-categoria').value = p.categoria_id;
            document.getElementById('prod-desc').value = p.descripcion;
            document.getElementById('prod-precio').value = p.precio;
            document.getElementById('prod-costo').value = p.costo;
            document.getElementById('prod-stock').value = p.stock;
            document.getElementById('modal-title').innerText = 'Editar Producto';
            document.getElementById('modal-producto').classList.add('open');
        }

        function cerrarModal() { 
            document.getElementById('modal-producto').classList.remove('open');
        }

        async function eliminarProducto(id) {
            if(confirm('¿Seguro que deseas eliminar este producto?')) {
                await supabaseClient.from('productos').delete().eq('id', id);
                cargarProductos();
            }
        }

        // GUARDAR PRODUCTO
        document.getElementById('form-producto').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btn-guardar');
            btn.innerHTML = 'Guardando...'; btn.disabled = true;
            
            const id = document.getElementById('prod-id').value;
            const fileInput = document.getElementById('prod-imagen');
            let imagen_url = id ? todosLosProductos.find(p => p.id == id).imagen_url : '';

            if (fileInput.files.length > 0) {
                const file = fileInput.files[0];
                const fileName = `${Date.now()}_${file.name}`;
                const { error } = await supabaseClient.storage.from('productos').upload(fileName, file);
                if (!error) {
                    const { data } = supabaseClient.storage.from('productos').getPublicUrl(fileName);
                    imagen_url = data.publicUrl;
                }
            }

            const payload = { 
                nombre: document.getElementById('prod-nombre').value, 
                categoria_id: parseInt(document.getElementById('prod-categoria').value),
                descripcion: document.getElementById('prod-desc').value, 
                precio: parseFloat(document.getElementById('prod-precio').value), 
                costo: parseFloat(document.getElementById('prod-costo').value), 
                stock: parseInt(document.getElementById('prod-stock').value), 
                imagen_url,
                activo: true 
            };

            if (id) {
                await supabaseClient.from('productos').update(payload).eq('id', id);
            } else {
                await supabaseClient.from('productos').insert([payload]);
            }

            btn.innerHTML = 'Guardar Producto'; btn.disabled = false;
            cerrarModal();
            cargarProductos();
        });

        window.onload = cargarProductos;
    </script>
</body>
</html>
